name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: ap-southeast-2
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Backend Testing
    - name: Cache backend dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov black flake8 isort safety bandit

    - name: Lint backend code
      run: |
        cd backend
        black --check --diff .
        isort --check-only --diff .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Backend security checks
      run: |
        cd backend
        safety check --ignore=70612 || true
        bandit -r app/ || true

    - name: Install Playwright browsers
      run: |
        cd backend
        playwright install chromium

    - name: Test backend
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
        REDIS_URL: redis://localhost:6379
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml || true

    # Frontend Testing
    - name: Cache frontend dependencies
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint and type-check frontend
      run: |
        cd frontend
        npm run lint || true
        npm run type-check

    - name: Frontend security audit
      run: |
        cd frontend
        npm audit --audit-level moderate || true

    - name: Build frontend
      env:
        VITE_API_URL: http://localhost:8000
      run: |
        cd frontend
        npm run build

    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build-${{ github.sha }}
        path: frontend/dist/

  # Validate Terraform configuration with AWS access
  terraform-validate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (AssumeRoleWithWebIdentity)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (AssumeRole)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0

    - name: Terraform Format Check
      run: |
        cd infra/terraform
        terraform fmt -check

    - name: Terraform Init
      run: |
        cd infra/terraform
        terraform init

    - name: Terraform Validate
      run: |
        cd infra/terraform
        terraform validate

    - name: Terraform Plan (Dry Run)
      run: |
        cd infra/terraform
        terraform plan \
          -var="openai_api_key=sk-test-key" \
          -var-file="environments/dev.tfvars"
      continue-on-error: true