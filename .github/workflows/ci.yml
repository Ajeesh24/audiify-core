name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  AWS_REGION: ap-southeast-1
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    # Backend CI
    - name: Cache backend dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install backend dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov black flake8 isort

    - name: Lint backend code
      run: |
        cd backend
        # Check code formatting
        black --check --diff .
        # Check imports
        isort --check-only --diff .
        # Check code style
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Install Playwright
      run: |
        cd backend
        playwright install chromium

    - name: Test backend
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
        REDIS_URL: redis://localhost:6379
      run: |
        cd backend
        # Run tests with coverage
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=html
      continue-on-error: true  # Allow tests to fail in CI for now

    # Frontend CI
    - name: Cache frontend dependencies
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint frontend code
      run: |
        cd frontend
        npm run lint
      continue-on-error: true  # Allow linting to fail for now

    - name: Type check frontend
      run: |
        cd frontend
        npm run type-check

    - name: Test frontend
      run: |
        cd frontend
        # npm run test
        echo "Frontend tests not implemented yet"

    - name: Build frontend
      env:
        VITE_API_URL: http://localhost:8000
      run: |
        cd frontend
        npm run build

    # Security checks
    - name: Run backend security checks
      run: |
        cd backend
        pip install safety bandit
        # Check for known vulnerabilities
        safety check --json || true
        # Check for security issues
        bandit -r app/ -f json || true
      continue-on-error: true

    - name: Run frontend security audit
      run: |
        cd frontend
        npm audit --audit-level moderate || true
      continue-on-error: true

    # Upload artifacts for debugging
    - name: Upload backend coverage
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: backend/htmlcov/
      if: always()

    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build-${{ github.sha }}
        path: frontend/dist/

  # Docker build test
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'test-docker')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: audifyy-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        # Note: Lambda containers don't work the same way as regular containers
        # This test is mainly to verify the image builds correctly
        echo "Lambda container image built successfully"

  # Terraform validation
  terraform-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (AssumeRoleWithWebIdentity)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (AssumeRole)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0

    - name: Terraform Init
      run: |
        cd infra/terraform
        terraform init -backend=false

    - name: Terraform Format Check
      run: |
        cd infra/terraform
        terraform fmt -check

    - name: Terraform Validate
      run: |
        cd infra/terraform
        terraform validate

    - name: Terraform Plan (Dry Run)
      run: |
        cd infra/terraform
        terraform plan \
          -var="openai_api_key=sk-test" \
          -var-file="environments/dev.tfvars"
      continue-on-error: true