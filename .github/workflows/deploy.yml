name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: audifyy-lambda-backend
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write
  contents: read

jobs:
  # Build frontend for deployment
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Cache frontend dependencies
      uses: actions/cache@v3
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install and build frontend
      env:
        VITE_API_URL: https://api.audifyy.com # Will be updated dynamically after backend deployment
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Upload frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  # Deploy infrastructure and backend together
  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    outputs:
      backend-url: ${{ steps.tf-output.outputs.backend_url }}
      frontend-bucket: ${{ steps.tf-output.outputs.frontend_bucket }}
      cloudfront-distribution-id: ${{ steps.tf-output.outputs.cloudfront_distribution_id }}
      cloudfront-domain: ${{ steps.tf-output.outputs.cloudfront_domain }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS deployment role
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get image version from tfvars
      id: get-version
      run: |
        IMAGE_TAG=$(grep 'image_tag' infra/terraform/environments/dev.tfvars | cut -d'"' -f2)
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Using image version: $IMAGE_TAG"

    - name: Build and push Docker image
      env:
        IMAGE_TAG: ${{ steps.get-version.outputs.image_tag }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
      run: |
        # Build Docker image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

        # Create ECR repository if it doesn't exist (Terraform will manage it going forward)
        aws ecr describe-repositories --repository-names $ECR_REPOSITORY --region $AWS_REGION >/dev/null 2>&1 || \
        aws ecr create-repository \
          --repository-name $ECR_REPOSITORY \
          --image-scanning-configuration scanOnPush=true \
          --region $AWS_REGION

        # Push to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false

    - name: Deploy infrastructure
      run: |
        cd infra/terraform
        terraform init
        terraform plan \
          -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
          -var-file="environments/dev.tfvars" \
          -out=tfplan
        terraform apply tfplan

    - name: Get Terraform outputs
      id: tf-output
      run: |
        cd infra/terraform
        echo "backend_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
        echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
        echo "cloudfront_domain=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT

  # Deploy frontend with correct backend URL
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS deployment role
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Update frontend config with real backend URL
      run: |
        BACKEND_URL="${{ needs.deploy.outputs.backend-url }}"
        echo "window.ENV = { VITE_API_URL: '$BACKEND_URL' };" > frontend/dist/env.js

    - name: Deploy to S3 and invalidate CloudFront
      run: |
        # Upload to S3
        aws s3 sync frontend/dist/ s3://${{ needs.deploy.outputs.frontend-bucket }} --delete

        # Invalidate CloudFront cache
        aws cloudfront create-invalidation \
          --distribution-id ${{ needs.deploy.outputs.cloudfront-distribution-id }} \
          --paths "/*"

  # Health check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy, deploy-frontend]

    steps:
    - name: Wait for deployment
      run: sleep 30

    - name: Test backend health
      run: |
        BACKEND_URL="${{ needs.deploy.outputs.backend-url }}"
        echo "Testing backend: $BACKEND_URL/api/health"

        # Test with retries for Lambda cold start
        for i in {1..5}; do
          if curl -f "$BACKEND_URL/api/health" --max-time 60; then
            echo "✅ Backend health check passed on attempt $i"
            break
          else
            echo "❌ Backend health check failed on attempt $i, retrying..."
            sleep 10
          fi
        done

    - name: Test frontend
      run: |
        FRONTEND_URL="https://${{ needs.deploy.outputs.cloudfront-domain }}"
        echo "Testing frontend: $FRONTEND_URL"

        if curl -f "$FRONTEND_URL" --max-time 30; then
          echo "✅ Frontend health check passed"
        else
          echo "❌ Frontend health check failed"
          exit 1
        fi

    - name: Deployment summary
      run: |
        echo "🚀 Deployment completed successfully!"
        echo ""
        echo "📊 **Deployment Summary:**"
        echo "Frontend URL: https://${{ needs.deploy.outputs.cloudfront-domain }}"
        echo "Backend API: ${{ needs.deploy.outputs.backend-url }}"
        echo "S3 Bucket: ${{ needs.deploy.outputs.frontend-bucket }}"
        echo "CloudFront Distribution: ${{ needs.deploy.outputs.cloudfront-distribution-id }}"