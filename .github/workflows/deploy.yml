name: Deploy Audifyy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: audifyy-lambda-backend
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  # Build and test the application
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run backend tests
      run: |
        cd backend
        # Add your test command here
        # python -m pytest tests/ -v

    - name: Run frontend tests
      run: |
        cd frontend
        # Add your test command here
        # npm test

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Upload frontend build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  # Deploy infrastructure
  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [test, deploy-backend]  # Now depends on backend being built first
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    outputs:
      backend-service-url: ${{ steps.tf-output.outputs.backend_service_url }}
      frontend-bucket: ${{ steps.tf-output.outputs.frontend_bucket }}
      cloudfront-distribution-id: ${{ steps.tf-output.outputs.cloudfront_distribution_id }}
      cloudfront-domain-name: ${{ steps.tf-output.outputs.cloudfront_domain_name }}
      lambda-function-name: ${{ steps.tf-output.outputs.lambda_function_name }}
      ecr-repository-url: ${{ steps.tf-output.outputs.ecr_repository_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (AssumeRoleWithWebIdentity)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (AssumeRole)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ~1.0
        terraform_wrapper: false

    - name: Terraform Init
      run: |
        cd infra/terraform
        echo "Initializing Terraform with S3 backend..."
        terraform init
        echo "Terraform init completed successfully"
        terraform --version
        ls -la .terraform/ || echo "No .terraform directory found"

    - name: Terraform Plan
      run: |
        cd infra/terraform
        echo "Running Terraform plan..."
        terraform plan \
          -var="openai_api_key=${{ secrets.OPENAI_API_KEY }}" \
          -var-file="environments/dev.tfvars" \
          -out=tfplan
        echo "Terraform plan completed successfully"

    - name: Terraform Apply
      run: |
        cd infra/terraform
        terraform apply tfplan

    - name: Get Terraform outputs
      id: tf-output
      run: |
        cd infra/terraform
        echo "backend_service_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT
        echo "frontend_bucket=$(terraform output -raw frontend_bucket_name)" >> $GITHUB_OUTPUT
        echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT
        echo "cloudfront_domain_name=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT
        echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
        echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT

  # Build and deploy backend Lambda
  deploy-backend:
    runs-on: ubuntu-latest
    needs: test  # Only depends on test, runs before infrastructure
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    outputs:
      ecr-repository-url: ${{ steps.create-ecr.outputs.ecr_repository_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials (AssumeRoleWithWebIdentity)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (AssumeRole)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Create ECR repository
      id: create-ecr
      run: |
        # Create ECR repository if it doesn't exist
        REPO_NAME="audifyy-lambda-backend"

        # Check if repository exists
        if ! aws ecr describe-repositories --repository-names $REPO_NAME --region $AWS_REGION >/dev/null 2>&1; then
          echo "Creating ECR repository: $REPO_NAME"
          aws ecr create-repository \
            --repository-name $REPO_NAME \
            --image-scanning-configuration scanOnPush=true \
            --region $AWS_REGION

          # Set lifecycle policy to keep only latest 10 images
          aws ecr put-lifecycle-policy \
            --repository-name $REPO_NAME \
            --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Keep last 10 images",
                  "selection": {
                    "tagStatus": "any",
                    "countType": "imageCountMoreThan",
                    "countNumber": 10
                  },
                  "action": {
                    "type": "expire"
                  }
                }
              ]
            }' \
            --region $AWS_REGION
        else
          echo "ECR repository $REPO_NAME already exists"
        fi

        # Output repository URL
        ECR_REPO_URL=$(aws ecr describe-repositories --repository-names $REPO_NAME --query 'repositories[0].repositoryUri' --output text --region $AWS_REGION)
        echo "ecr_repository_url=$ECR_REPO_URL" >> $GITHUB_OUTPUT
        echo "ECR Repository URL: $ECR_REPO_URL"

    - name: Get image version from tfvars
      id: get-version
      run: |
        # Extract image_tag from tfvars file
        IMAGE_TAG=$(grep 'image_tag' infra/terraform/environments/dev.tfvars | cut -d'"' -f2)
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "Using image version: $IMAGE_TAG"

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Lambda container image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_URL: ${{ steps.create-ecr.outputs.ecr_repository_url }}
        IMAGE_TAG: ${{ steps.get-version.outputs.image_tag }}
      run: |
        echo "Building Lambda Docker image with semantic version: $IMAGE_TAG"

        # Build Lambda Docker image using the Dockerfile in root
        docker build -t $ECR_REPOSITORY_URL:$IMAGE_TAG .
        docker build -t $ECR_REPOSITORY_URL:latest .

        # Push to ECR
        docker push $ECR_REPOSITORY_URL:$IMAGE_TAG
        docker push $ECR_REPOSITORY_URL:latest

        echo "Successfully pushed image with tag: $IMAGE_TAG"

    - name: Update Lambda function via Terraform
      run: |
        cd infra/terraform
        echo "Terraform will update Lambda function with new image version during terraform apply"
        # The Lambda function will be updated when terraform apply runs with the new image_tag

  # Deploy frontend
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-backend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download frontend build artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

    - name: Configure AWS credentials (AssumeRoleWithWebIdentity)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_GITHUB_TRUST_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (AssumeRole)
      uses: aws-actions/configure-aws-credentials@v4.0.2
      with:
        role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE }}
        role-session-name: "GitHubActions"
        aws-region: ${{ env.AWS_REGION }}
        role-chaining: true

    - name: Update frontend config with backend URL
      run: |
        # Update the frontend config to point to the deployed backend
        BACKEND_URL="${{ needs.deploy-infrastructure.outputs.backend-service-url }}"
        echo "window.ENV = { VITE_API_URL: '$BACKEND_URL' };" > frontend/dist/env.js

    - name: Deploy to S3
      run: |
        aws s3 sync frontend/dist/ s3://${{ needs.deploy-infrastructure.outputs.frontend-bucket }} --delete

    - name: Invalidate CloudFront
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ needs.deploy-infrastructure.outputs.cloudfront-distribution-id }} \
          --paths "/*"

  # Health check
  health-check:
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Wait for Lambda deployment
      run: sleep 30

    - name: Check backend Lambda health
      run: |
        BACKEND_URL="${{ needs.deploy-infrastructure.outputs.backend-service-url }}"
        echo "Testing API Gateway URL: $BACKEND_URL/api/health"

        # Test health endpoint with retries for Lambda cold start
        for i in {1..5}; do
          if curl -f "$BACKEND_URL/api/health" --max-time 60; then
            echo "Health check passed on attempt $i"
            break
          else
            echo "Health check failed on attempt $i, retrying..."
            sleep 10
          fi
        done

    - name: Check frontend
      run: |
        FRONTEND_URL="https://${{ needs.deploy-infrastructure.outputs.cloudfront-domain-name }}"
        curl -f "$FRONTEND_URL" || exit 1

    - name: Deployment Success Notification
      run: |
        echo "✅ Lambda deployment successful!"
        echo "Frontend: https://${{ needs.deploy-infrastructure.outputs.cloudfront-domain-name }}"
        echo "Backend API: ${{ needs.deploy-infrastructure.outputs.backend-service-url }}"
        echo "Lambda Function: ${{ needs.deploy-infrastructure.outputs.lambda-function-name }}"